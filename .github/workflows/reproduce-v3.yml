name: Reproduce V3 scores

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/reproduce-v3.yml"
      - "reproduction/**"
      - "requirements-reproduction.txt"
      - "scripts/reproduce_v3_results.py"
      - "tasks/pilot_v1/**/tests/**"

permissions:
  contents: read

jobs:
  replay-fixed-workbooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-reproduction.txt
      - name: Install evaluator dependencies
        run: python -m pip install -r requirements-reproduction.txt
      - name: Replay all published workbooks
        run: python scripts/reproduce_v3_results.py --workers 4
